[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/prometheion/ares"

[workspace.dependencies]
ares-core = { path = "crates/core" }
ares-gguf = { path = "crates/gguf" }
ares-cuda = { path = "crates/cuda" }
ares-state = { path = "crates/state" }
ares-sched = { path = "crates/sched" }
ares-weights = { path = "crates/weights" }
ares-store = { path = "crates/store" }
ares-tokenizer = { path = "crates/tokenizer" }
ares-sampler = { path = "crates/sampler" }
ares-grammar = { path = "crates/grammar" }

# The grammar engine behind structured output (MIT): an Earley parser with a
# lexer built on derivatives, which gives the tokens a grammar allows next. The
# default features also pull in a thread pool that serves its C interface, which
# this engine does not use.
llguidance = { version = "1.9", default-features = false, features = ["lark", "referencing", "ahash"] }
toktrie = "1.9"

thiserror = "2"
memmap2 = "0.9"
libloading = "0.8"
libc = "0.2"
# The interpreter of chat templates. The features are the ones the dialect of
# ares-tokenizer uses; "unstable_machinery" is the syntax tree that it checks a
# template against, and the version is pinned by Cargo.lock.
minijinja = { version = "2", default-features = false, features = ["adjacent_loop_items", "builtins", "debug", "macros", "preserve_order", "std_collections", "unstable_machinery"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Tests read real model files and run reference math, so they need optimized code.
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

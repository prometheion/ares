[package]
name = "ares-server"
description = "The ares binary: loads a model onto the devices and serves it over an OpenAI-compatible HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ares_server"

[[bin]]
name = "ares"
path = "src/main.rs"

[dependencies]
ares-api = { path = "../api" }
ares-core = { path = "../core" }
# Devices are chosen, opened and described here before the runtime gets them.
ares-cuda.workspace = true
ares-gguf = { path = "../gguf" }
ares-model = { path = "../model" }
ares-runtime = { path = "../runtime" }
# The variables of a chat template that are set at start.
ares-tokenizer.workspace = true

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in-process, without a socket.
tower = { version = "0.5", features = ["util"] }
# The end-to-end tests speak raw HTTP over a TcpStream.
tokio = { version = "1", features = ["io-util"] }

[lints]
workspace = true

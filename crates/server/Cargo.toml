[package]
name = "ares-server"
description = "The ares binary: loads a model onto the devices and serves it over an OpenAI-compatible HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ares_server"

[[bin]]
name = "ares"
path = "src/main.rs"

[dependencies]
ares-api = { path = "../api" }
ares-core = { path = "../core" }
# Devices are chosen, opened and described here before the runtime gets them.
ares-cuda.workspace = true
ares-gguf = { path = "../gguf" }
# The grammar of the calls of tools, and the kinds of value a tool's schema
# allows for an argument.
ares-grammar.workspace = true
ares-model = { path = "../model" }
ares-runtime = { path = "../runtime" }
# The variables of a chat template that are set at start.
ares-tokenizer.workspace = true

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false }
# Decoding the images of requests (JPEG, PNG, GIF, WebP, BMP) to RGB pixels.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
# The connections, with the timeouts of reading a request and of writing an
# answer (the `listen` module); axum serves on the same.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-graceful", "service", "tokio"] }
# `_exit`, for a stop that a signal asks to be immediate (see `main.rs`).
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
# The sampler settings and the page layout a test model reports
# (tests/reasoning_cache.rs).
ares-sampler.workspace = true
ares-state.workspace = true
# `ServiceExt::oneshot` drives the router in-process, without a socket.
tower = { version = "0.5", features = ["util"] }
# The end-to-end tests speak raw HTTP over a TcpStream.
tokio = { version = "1", features = ["io-util"] }

[lints]
workspace = true

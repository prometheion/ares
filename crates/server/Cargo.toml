[package]
name = "ares-server"
description = "HTTP front end of the engine: OpenAI-compatible completions and the System One decision API over an Engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ares_server"

[[bin]]
name = "ares"
path = "src/main.rs"

[dependencies]
ares-api = { path = "../api" }
ares-core = { path = "../core" }
ares-gguf = { path = "../gguf" }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in-process, without a socket.
tower = { version = "0.5", features = ["util"] }
# The end-to-end tests speak raw HTTP over a TcpStream.
tokio = { version = "1", features = ["io-util"] }

[lints]
workspace = true

[package]
name = "ares-model"
description = "Model architectures: their configuration, weights, CPU reference and implementation on devices, the DFlash drafter, and the shared blocks of a step"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Table rows and experts are read from the model file while it runs.
ares-io = { path = "../io" }
ares-api = { path = "../api" }
ares-core.workspace = true
ares-cuda.workspace = true
ares-gguf.workspace = true
ares-quant = { path = "../quant" }
ares-runtime = { path = "../runtime" }
ares-sampler.workspace = true
ares-state.workspace = true
ares-tokenizer.workspace = true
# How far ahead of a layer the experts of a prompt are read.
ares-weights.workspace = true
# The names of images: a digest of the pixels the tower is given.
sha2 = "0.10"
thiserror.workspace = true

[[example]]
name = "q4synth"
path = "tools/q4synth.rs"

[[example]]
name = "q4compare"
path = "tools/q4compare.rs"

[[example]]
name = "q4trace"
path = "tools/q4trace.rs"

[dev-dependencies]
ares-vulkan = { path = "../vulkan" }

[lints]
workspace = true

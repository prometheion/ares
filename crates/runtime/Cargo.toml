[package]
name = "ares-runtime"
description = "The step loop of the engine: one conductor thread, one thread per device, a synthetic model to drive them, and the timing that shows where a step goes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ares-api = { path = "../api" }
ares-core.workspace = true
ares-cuda.workspace = true
ares-grammar.workspace = true
ares-sampler.workspace = true
ares-io = { path = "../io" }
# The exact reference that the tables of the CPU expert kernels are read from.
ares-quant = { path = "../quant" }
ares-sched.workspace = true
ares-state.workspace = true
ares-weights.workspace = true
# Worker threads of the CPU expert kernels are bound to cores.
libc.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The expert store is tested and measured on model files.
ares-gguf.workspace = true
# The HTTP example serves the synthetic engine through the real front end and
# drives it with raw sockets.
ares-server = { path = "../server" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[lints]
workspace = true

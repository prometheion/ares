[package]
name = "ares-tokenizer"
description = "Text to token ids and back for the byte-level BPE vocabularies of GGUF models, and their Jinja chat templates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The formats a chat template declares are the API's types.
ares-api = { path = "../api" }
ares-gguf.workspace = true
minijinja.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The fingerprint of a tokenizer in the files of the draft_vocab example.
sha2 = "0.10"

[[example]]
name = "draft_vocab"
# Its tests run with the crate's.
test = true

[lints]
workspace = true
